<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Broken Layout Example</title>
</head>
<body>
    <h1> 
        <span style="color:red;">Hello</span>

    </h1>
    <a href="https://www.google.com/">Google</a>"
    <p>This is supposed to be a normal paragraph text. But look at it—it is huge and bold because the browser thinks it is still inside the headline!</p>

</body> 
</html>
